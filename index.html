ing:20px 14px}h1{font-size:24px}.toolbar label{width:100%}}</style></head><body><main><div class="eyebrow">BRIGHT PAPER / PAIRED DEMOS</div><h1 id="demoTitle">明亮纸感</h1><p>每个demo一组：两份独立prompt、无声与有声两版MP4。动作卡和参考实现共用，声音文件只属于有声版本。</p>
<div class="toolbar"><label for="demoSelect">选择样段 <select id="demoSelect" aria-label="选择动效样段"></select></label><label for="versionSelect">声音版本 <select id="versionSelect" aria-label="声音版本"><option value="silent">无声版</option><option value="with_sound">有动作声版</option></select></label><button id="movieMode" aria-pressed="true">视频</button><button id="sourceMode" aria-pressed="false">源码重演</button><a id="download" download>下载无声版</a></div>
<div class="stage"><video id="master" muted playsinline preload="metadata" aria-label="所选版本Demo"></video><div id="replay"></div></div>
<div class="controls"><button id="play">播放</button><button id="restart">重播</button><label class="small" for="seek">定位</label><input id="seek" type="range" min="0" max="6.700" step="0.001" value="0" aria-label="样段时间定位"><output id="time">0.000 / 6.700秒</output></div>
<p id="spec" class="small"></p><p id="modeNote" class="note" aria-live="polite"></p><p id="error" class="note" role="alert"></p>
<div class="links" aria-label="两版制作提示词"><a id="silentPrompt">无声版prompt</a><a id="soundPrompt">有声版prompt</a><a href="reference_realization/NeutralDemos.tsx" download>共享TSX实现</a><a href="README.md">分组目录说明</a></div>
<section class="sound-panel" aria-label="有声版本的小音频"><p id="soundStatus" class="small" role="status" data-trigger-count="0" data-last-sound="">默认无声版。</p><div id="soundList" class="sound-list"></div><audio id="motionAudio" preload="none"></audio></section>
<p class="small">视频模式直接播放所选MP4。有声源码模式让主视频静音后按cue播放声音；单独试听会暂停主视频，避免叠声。默认打开无声版。</p></main><script src="reference_realization/browser.js" defer></script></body></html>
